apiVersion: 1
datasources:
  - name: Homelab Metrics
    uid: homelab-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: grafana_reader
    isDefault: true
    editable: false
    jsonData:
      database: homelab
      sslmode: disable
      postgresVersion: 1800
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: $METRICS_DB_PASSWORD
