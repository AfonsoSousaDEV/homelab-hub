# Used only by tests/run_integration.py with a unique Compose project and fresh volumes.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: n8n
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD: ${TEST_N8N_DATABASE_PASSWORD:?test runner sets this}
    volumes:
      - test_n8n_postgres:/var/lib/postgresql/data
    networks:
      default:
        aliases: [n8n-postgres]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U n8n -d n8n']
      interval: 2s
      timeout: 3s
      retries: 30

  metrics-postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: homelab_owner
      POSTGRES_DB: homelab
      POSTGRES_PASSWORD: ${TEST_DATABASE_PASSWORD:?test runner sets this}
      METRICS_WRITER_PASSWORD: ${TEST_WRITER_PASSWORD:?test runner sets this}
      GRAFANA_READER_PASSWORD: ${TEST_READER_PASSWORD:?test runner sets this}
    volumes:
      - test_postgres:/var/lib/postgresql
      - ../db/bootstrap:/docker-entrypoint-initdb.d:ro
      - ../db/migrations:/migrations:ro
    networks:
      metrics:
        aliases: [postgres]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U homelab_owner -d homelab']
      interval: 2s
      timeout: 3s
      retries: 30

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.4
    entrypoint: [/bin/sh, -c, 'sleep infinity']
    init: true
    environment:
      N8N_ENCRYPTION_KEY: ${TEST_N8N_KEY:?test runner sets this}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      OLLAMA_MODEL: synthetic-model
      N8N_RUNNERS_ENABLED: "true"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${TEST_N8N_DATABASE_PASSWORD:?test runner sets this}
    networks:
      default: {}
      metrics: {}
    volumes:
      - test_n8n:/home/node/.n8n
      - ${N8N_TEST_ARTIFACT_DIR:?test runner sets this}:/fixtures:ro

  mock-services:
    image: docker.n8n.io/n8nio/n8n:2.47.4
    entrypoint: [node, /test/mock-server.js]
    volumes:
      - ./tests/mock-server.js:/test/mock-server.js:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  default:
    internal: true
  metrics:
    internal: true

volumes:
  test_postgres:
  test_n8n:
  test_n8n_postgres:
