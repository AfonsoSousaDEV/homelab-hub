name: homelab-hub

# Week 1 baseline: Postgres + n8n + Ollama.
# API and dashboard are added by their owners (M4 / M3) once the interface
# contract in docs/plano-semana-1.md is agreed.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the application database (homelab) on first boot.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-homelab} -d ${POSTGRES_DB:-n8n}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homelab

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-homelab}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY no .env}
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TZ:-Europe/Lisbon}
      # Needed so workflows can read OLLAMA_* / DISCORD_WEBHOOK_URL / API_*.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      # Kept as an alias for the setup helper from the workflow module.
      OLLAMA_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      API_KEY: ${API_KEY:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - homelab

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment on Linux/WSL2 with NVIDIA Container Toolkit to use the GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - homelab

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-homelab}:${POSTGRES_PASSWORD}@postgres:5432/${APP_DB_NAME:-homelab}
      API_KEY: ${API_KEY:?defina API_KEY no .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - homelab

  # --- Added by M3 (Dani).
  # dashboard:
  #   build: ./dashboard
  #   profiles: ["dashboard"]
  #   ports:
  #     - "8501:8501"
  #   environment:
  #     API_BASE_URL: http://api:8000
  #     API_KEY: ${API_KEY}
  #   depends_on:
  #     - api
  #   networks:
  #     - homelab

volumes:
  postgres_data:
  n8n_data:
  ollama_data:

networks:
  homelab:
    driver: bridge
