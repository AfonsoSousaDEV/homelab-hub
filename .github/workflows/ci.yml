name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r api/requirements.txt pytest httpx ruff
      - run: ruff check api tests
      - run: pytest

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: printf 'POSTGRES_PASSWORD=ci\nAPI_KEY=ci\n' > .env
      - run: docker compose config
